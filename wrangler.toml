
main = "src/routes/index.ts"
compatibility_date = "2024-08-15"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

# Creates the waiting room's Durable Object class (src/waitingroom/durable.ts). Free
# accounts can only use SQLite-backed classes. Environments inherit migrations, unlike
# bindings.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WaitingRoom"]

[env.production]
name = "foo"
routes = [{ pattern = "foobar.rustymagnet.xyz", custom_domain = true }]
# serves static folder
assets = { directory = "./public/static", binding = "ASSETS" }

[env.production.vars]
SECURITY_HEADER_NAME = "X-Header"
SIGNING_ALGORITHM = "HS256"
ENVIRONMENT= "prod"
BODY_DEADLINE_MS = "10000" # a /stopdos POST body must arrive within this
STOPDOS_SHIELD = "on" # "off" sends /stopdos POSTs to the origin unchecked: README, "Turn the shield off"
WAITING_ROOM_QUEUE = "on" # "off" lets every /waiting-room visitor straight in: README, "Turn the queue off"
WAITING_ROOM_CAPACITY = "1" # visitors let in at once: 1, so two browser windows are enough to see the queue
WAITING_ROOM_STAY_SECONDS = "30" # how long each one gets

# /stopdos forwards to fragile-origin (origin/wrangler.toml), which has no public route.
# Service bindings don't inherit between environments, so each one declares it.
[[env.production.services]]
binding = "ORIGIN"
service = "fragile-origin"

# /waiting-room's count of who's in, and its queue
[[env.production.durable_objects.bindings]]
name = "WAITING_ROOM"
class_name = "WaitingRoom"

[env.testing]
# so `npm start` serves site.css and the favicons too
assets = { directory = "./public/static", binding = "ASSETS" }

# `wrangler dev --env=testing` picks up variables in this section
# NOTE [vars] is a non-inheritable key so not usable when using environment specific
# values in the .devs.vars override these values. Useful default for CI/CD tests
# local test uses .devs.vars file.
# CI/CD uses the values inside [env.testing.vars] as no .devs.vars file in source control
[env.testing.vars]
SECURITY_HEADER_NAME = "X-Header"
SECRET_KEY = "dummy"
SIGNING_ALGORITHM = "HS256"
ENVIRONMENT = "TESTING"
BODY_DEADLINE_MS = "2000"
STOPDOS_SHIELD = "on"
WAITING_ROOM_QUEUE = "on"
WAITING_ROOM_CAPACITY = "1"
WAITING_ROOM_STAY_SECONDS = "30"

[[env.testing.services]]
binding = "ORIGIN"
service = "fragile-origin"

[[env.testing.durable_objects.bindings]]
name = "WAITING_ROOM"
class_name = "WaitingRoom"

[dev]
port = 8787
local_protocol = "http"

[observability]
enabled = true